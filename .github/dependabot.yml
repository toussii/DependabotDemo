---
version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "daily"
  - package-ecosystem: npm
    directory: "/javascript"
    schedule:
      interval: "daily"
    target-branch: "main"
    pull-request-branch-name:
      prefix: "feature/1234_dependabot"
  - package-ecosystem: bundler
    directory: "/ruby"
    schedule:
      interval: "daily"
    target-branch: "main"
    pull-request-branch-name:
      prefix: "feature/5678_dependabot"
      separator: "_"
      word-separator: "-"
      branch-name-case: "lowercase"
    labels:
      - "dependencies"
      - "security"
      - "dependabot"
      - "github-actions"
