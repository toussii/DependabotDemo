---
version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: 'daily'
      time: '02:00'
      timezone: 'Europe/Amsterdam'
    commit-message:
      # Prefix all commit messages with "dependabot: "
      prefix: 'dependabot'
    groups:
      major:
        update-types:
          - 'major'
      non-major:
        update-types:
          - 'minor'
          - 'patch'
    # Allow up to 2 open pull requests
    open-pull-requests-limit: 2
    pull-request-branch-name:
      prefix: "feature/5678_dependabot"
      template: "{prefix}_{package_manager}-{name}"
      word-separator: "_"
      branch-name-case: "lowercase"
    labels:
      - "dependencies"
      - "security"
      - "dependabot"
      - "github-actions"
  - package-ecosystem: npm
